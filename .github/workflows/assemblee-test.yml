on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Lire les paramètres NocoDB
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}
        run: |
          curl -s \
            "https://app.nocodb.com/api/v2/tables/m11t0ljstiom0gs/records" \
            -H "accept: application/json" \
            -H "xc-token: $NOCODB_TOKEN"

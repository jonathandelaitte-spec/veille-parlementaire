name: Test NocoDB

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer une ligne de test à NocoDB
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}
        run: |
          curl -X POST \
            "https://app.nocodb.com/api/v2/tables/mwid9tcc0oymdx9/records" \
            -H "accept: application/json" \
            -H "xc-token: $NOCODB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "Titre": "TEST GitHub → NocoDB",
              "Source": "GitHub Actions",
              "Thématique": "Test",
              "Alerte": "🟢 Nouveau",
              "Statut": "À traiter"
            }'
